<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Option 4.2: Grid Matrix - Vertical Lift</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000000; font-family: 'Inter', sans-serif; }
    canvas { display: block; }
    .info {
      position: fixed; top: 20px; left: 20px; color: #B19CD9; font-size: 14px; z-index: 10;
      background: rgba(0,0,0,0.6); padding: 15px; border-radius: 8px; border: 1px solid #B19CD9;
    }
    .controls { position: fixed; bottom: 20px; left: 20px; color: #fff; font-size: 12px; z-index: 10; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div class="info">
    <strong>Option 4.2: Grid Matrix</strong><br>
    Mouse lifts particles upward<br>
    Colors: Lavender, White, Black
  </div>
  <div class="controls">
    <p>📊 Infinite grid perspective</p>
    <p>🌐 Symbolizes data structure and matrix</p>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    const canvas = document.getElementById('canvas');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });

    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x000000);
    camera.position.z = 50;
    camera.position.y = 10;
    camera.lookAt(0, 0, -100);

    const particles = [];
    const gridSize = 20;
    const spacing = 5;

    const geometry = new THREE.BufferGeometry();
    const positions = [];
    const colors = [];

    for (let x = -gridSize; x <= gridSize; x++) {
      for (let z = -gridSize; z <= gridSize; z++) {
        positions.push(x * spacing, 0, z * spacing);
        colors.push(0.69, 0.6, 0.85);
        particles.push({ x: x * spacing, z: z * spacing, originalY: 0, currentY: 0 });
      }
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(positions), 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(new Float32Array(colors), 3));

    const material = new THREE.PointsMaterial({
      size: 0.3,
      vertexColors: true,
      transparent: true
    });

    const points = new THREE.Points(geometry, material);
    scene.add(points);

    const lineGeometry = new THREE.BufferGeometry();
    const linePositions = [];

    for (let x = -gridSize; x <= gridSize; x++) {
      linePositions.push(x * spacing, 0, -gridSize * spacing);
      linePositions.push(x * spacing, 0, gridSize * spacing);
    }

    for (let z = -gridSize; z <= gridSize; z++) {
      linePositions.push(-gridSize * spacing, 0, z * spacing);
      linePositions.push(gridSize * spacing, 0, z * spacing);
    }

    lineGeometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(linePositions), 3));
    const lineMaterial = new THREE.LineBasicMaterial({ color: 0x7B68EE, transparent: true, opacity: 0.3 });
    const lines = new THREE.LineSegments(lineGeometry, lineMaterial);
    scene.add(lines);

    let time = 0;
    let mouseX = 0, mouseY = 0;

    document.addEventListener('mousemove', (e) => {
      mouseX = (e.clientX / window.innerWidth) * 2 - 1;
      mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      time += 0.01;

      const positions = geometry.attributes.position.array;
      const colors = geometry.attributes.color.array;

      particles.forEach((particle, index) => {
        const distance = Math.sqrt(
          (particle.x - mouseX * 50) ** 2 + (particle.z - mouseY * 50) ** 2
        );

        if (distance < 20) {
          const lift = (1 - distance / 20) * 8;
          particle.currentY += (lift - particle.currentY) * 0.1;
        } else {
          particle.currentY *= 0.95;
        }

        positions[index * 3 + 1] = particle.currentY;

        if (distance < 20) {
          colors[index * 3] = 1.0;
          colors[index * 3 + 1] = 1.0;
          colors[index * 3 + 2] = 1.0;
        } else {
          colors[index * 3] = 0.69;
          colors[index * 3 + 1] = 0.6;
          colors[index * 3 + 2] = 0.85;
        }
      });

      geometry.attributes.position.needsUpdate = true;
      geometry.attributes.color.needsUpdate = true;

      camera.position.x = Math.sin(time * 0.1) * 20;
      camera.position.z = 50 + Math.cos(time * 0.1) * 10;
      camera.lookAt(0, 0, 0);

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
